# Proxy de entrada compartido: tiene los puertos 80 y 443, saca los certificados
# y reparte por dominio a los Caddy de cada proyecto por la red "edge".
name: edge

services:
    caddy:
        image: caddy:2.10-alpine
        env_file:
            - .env
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - edge
        read_only: true
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000,mode=1777
        user: "1000:1000"
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        security_opt:
            - no-new-privileges:true
        mem_limit: 128m
        restart: unless-stopped

networks:
    edge:
        external: true

volumes:
    caddy_data:
    caddy_config:
